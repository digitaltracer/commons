# cargo-deny checks dependency licenses, advisories and sources.
# The project's own license is undecided, so workspace crates (publish = false) are skipped.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates are flagged only when a workspace crate depends on them directly;
# transitive ones (paste via leptos, proc-macro-error via gtk, astral-tokio-tar via
# testcontainers) have no maintained replacement upstream yet.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
