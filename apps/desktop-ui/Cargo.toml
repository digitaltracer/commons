[package]
name = "desktop-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Commons views in Leptos (Rust compiled to WASM). Depends on proto only: no storage, no network."

[dependencies]
proto.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["serde", "js"] }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Element", "HtmlElement", "HtmlTextAreaElement", "Window", "Performance", "KeyboardEvent", "ScrollToOptions", "ScrollBehavior", "DomRect"] }
console_error_panic_hook = "0.1"

[lints]
workspace = true
