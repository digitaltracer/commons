# commons.adarshnb.com -> commonsd on 127.0.0.1:8090 (deploy/compose.yaml).
# Plain port 80 on purpose: `certbot --nginx -d commons.adarshnb.com` adds the TLS listener,
# the certificate paths and the http-to-https redirect to this block.
server {
    listen 80;
    listen [::]:80;
    server_name commons.adarshnb.com;

    # Matches COMMONS_MAX_FILE_BYTES (104857600 = 100m); uploads are the raw file as the body.
    client_max_body_size 100m;

    proxy_http_version 1.1;

    # Each location repeats the forwarding headers: a location that sets any
    # proxy_set_header inherits none from the server level. commonsd takes the client's
    # address for its per-IP login limit from X-Real-IP, so it must always be nginx's own
    # $remote_addr, never a value the client sent.
    location = /v1/socket {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Neither side pings, so these bound how long a quiet socket stays open.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        # Stream uploads to commonsd instead of spooling them to nginx's disk first.
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
